name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  projecta:
    name: ProjectA — Bookshop tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projecta
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      USE_SQLITE: "1"
      PROJECTA_SECRET_KEY: ci-secret
      JWT_SIGNING_KEY: ci-jwt
      PROJECTA_REDIS_URL: redis://localhost:6379/0
      PROJECTA_CELERY_BROKER: redis://localhost:6379/1
      PROJECTA_CELERY_BACKEND: redis://localhost:6379/2
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projecta/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-env
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests with coverage
        run: pytest --cov-fail-under=70
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: projecta-coverage
          path: projecta/coverage.xml

  projectb:
    name: ProjectB — Warehouse tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projectb
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      USE_SQLITE: "1"
      PROJECTB_SECRET_KEY: ci-secret
      JWT_SIGNING_KEY: ci-jwt
      PROJECTB_REDIS_URL: redis://localhost:6379/0
      PROJECTB_CELERY_BROKER: redis://localhost:6379/1
      PROJECTB_CELERY_BACKEND: redis://localhost:6379/2
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projectb/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-env
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests with coverage
        run: pytest --cov-fail-under=70
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: projectb-coverage
          path: projectb/coverage.xml

  frontend:
    name: React frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    name: Docker compose build
    runs-on: ubuntu-latest
    needs: [projecta, projectb, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: cp .env.example .env
      - name: Build images
        run: docker compose build
