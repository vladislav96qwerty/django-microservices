user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 25M;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;

    upstream projecta_upstream {
        server projecta:8000;
    }

    upstream projectb_upstream {
        server projectb:8001;
    }

    upstream frontend_upstream {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # ProjectA — bookshop API (default)
        location /api/ {
            proxy_pass http://projecta_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ProjectA admin + docs
        location /admin/ {
            proxy_pass http://projecta_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/schema/ {
            proxy_pass http://projecta_upstream;
            proxy_set_header Host $host;
        }

        location /api/docs/ {
            proxy_pass http://projecta_upstream;
            proxy_set_header Host $host;
        }

        location /health/ {
            proxy_pass http://projecta_upstream;
            proxy_set_header Host $host;
        }

        # ProjectB — warehouse API
        location /warehouse/ {
            proxy_pass http://projectb_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /warehouse-admin/ {
            proxy_pass http://projectb_upstream;
            proxy_set_header Host $host;
        }

        location /warehouse-health/ {
            proxy_pass http://projectb_upstream/health/;
            proxy_set_header Host $host;
        }

        # Static files
        location /static/projecta/ {
            alias /var/www/projecta/static/;
            expires 30d;
        }

        location /media/ {
            alias /var/www/projecta/media/;
            expires 30d;
        }

        location /static/projectb/ {
            alias /var/www/projectb/static/;
            expires 30d;
        }

        # React frontend (catch-all)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
